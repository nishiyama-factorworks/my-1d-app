name: PR Links

# PR 本文に Issue への参照（Closes #N / Refs #N）、または「Issue: なし」があることを確認する。
# 助言的なチェック（必須チェックには含めない運用を想定）。Dependabot の PR は対象外。

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-links:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: PR 本文に Issue への参照があるか
        env:
          # 本文は信頼できない入力。式展開をスクリプトに直接埋め込まず、環境変数経由で渡す。
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]]*:?[[:space:]]+#[0-9]+'; then
            echo "OK: Issue への参照があります。"
          elif printf '%s' "$PR_BODY" | grep -Eq 'Issue:[[:space:]]*なし'; then
            echo "OK: Issue なしと明記されています。"
          else
            echo "::error::PR 本文に 'Closes #<番号>' / 'Refs #<番号>'、または 'Issue: なし（理由）' を書いてください。"
            exit 1
          fi
